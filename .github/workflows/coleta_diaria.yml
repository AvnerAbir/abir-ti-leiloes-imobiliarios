name: Integracao de Dados ABIR TI

on:
  push:
    paths:
      - "coleta/lance_novo_progressivo.csv"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coleta-abir-ti
  cancel-in-progress: false

jobs:
  integrar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verificar arquivo de dados
        id: verificar
        run: |
          if [ -f coleta/lance_novo_progressivo.csv ]; then
            echo "disponivel=true" >> "$GITHUB_OUTPUT"
          else
            echo "disponivel=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Integrar registros
        if: steps.verificar.outputs.disponivel == 'true'
        run: python coleta/integrar_lance.py

      - name: Publicar base atualizada
        if: steps.verificar.outputs.disponivel == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coleta/base_consolidada_com_caixa.csv
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza base de imoveis automaticamente"
            git push
          else
            echo "Nenhuma alteracao na base."
          fi
